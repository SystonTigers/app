<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Drop - Legal Documents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0B1220 0%, #1a365d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #0B1220;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .links {
            display: grid;
            gap: 20px;
        }

        .link-card {
            display: block;
            padding: 30px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            border-color: #3182ce;
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15);
        }

        .link-card h2 {
            color: #0B1220;
            font-size: 1.5em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-card p {
            color: #666;
            line-height: 1.6;
        }

        .icon {
            font-size: 1.3em;
        }

        footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2em;
            }

            .link-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚽ Field Drop</h1>
        <p class="subtitle">Legal Documents</p>

        <div class="links">
            <a href="/privacy.html" class="link-card">
                <h2><span class="icon">🔒</span> Privacy Policy</h2>
                <p>Learn how we collect, use, and protect your personal information.</p>
            </a>

            <a href="/terms.html" class="link-card">
                <h2><span class="icon">📋</span> Terms of Service</h2>
                <p>Read the terms and conditions for using Field Drop.</p>
            </a>
        </div>

        <footer>
            <p>Last Updated: January 14, 2026</p>
            <p>&copy; 2026 Syston Tigers. All rights reserved.</p>
        </footer>
    </div>
</body>

</html>
