name = "app"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
minify = true
workers_dev = true

[observability]
enabled = true

# Default D1 binding for local development
[[d1_databases]]
binding = "DB"
database_name = "syston-db-local"
database_id = "local-db-id"
migrations_dir = "migrations"

# Default KV bindings for local development and testing
[[kv_namespaces]]
binding = "TENANTS"
id = "local-tenants-kv"

[[kv_namespaces]]
binding = "KV_IDEMP"
id = "local-idemp-kv"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "local-flags-kv"

# Default vars for local development and testing
[vars]
API_VERSION = "v1"
JWT_SECRET = "test-secret-key-at-least-32-characters-long"
JWT_ISSUER = "test-issuer"
JWT_AUDIENCE = "syston-mobile"
ENVIRONMENT = "development"
ADMIN_CONSOLE_URL = "http://localhost:3000"
# SECURITY: DISABLE_RATE_LIMITING - Only uncomment for local dev without KV
# NEVER enable in production/preview - rate limiting fails closed by default
# DISABLE_RATE_LIMITING = "true"

# ─────────────────────────────────────────────────────────
# PRODUCTION ENVIRONMENT
# ─────────────────────────────────────────────────────────
[env.production]
compatibility_date = "2024-11-01"

[env.production.vars]
# Global vars
API_VERSION = "v1"
JWT_ISSUER = "syston.app"
JWT_AUDIENCE = "syston-mobile"
APP_VERSION = "7.0.0"
FIXTURES_REFRESH_URL = "https://syston-fixtures.team-platform-2025.workers.dev/refresh"
ALLOWED_WEBHOOK_HOSTS = "hook.make.com,hook.eu2.make.com,hook.us1.make.com,*.make.com,webhook.site"
SETUP_URL = "https://setup-console.team-platform-2025.workers.dev"
GALLERY_ALLOWED = "image/jpeg,image/png,image/webp"
GALLERY_MAX_BYTES = "10485760"
YT_REDIRECT_URL = "https://syston-postbus.team-platform-2025.workers.dev/api/v1/admin/yt/callback"
RL_POSTS_PER_MIN = "60"
RL_UPLOADS_PER_MIN = "20"
APPS_SCRIPT_AUTO_DEPLOY = "true"
BACKEND_URL = "https://syston-postbus.team-platform-2025.workers.dev"
ADMIN_CONSOLE_URL = "https://admin-console.team-platform-2025.workers.dev"
RESEND_FROM_EMAIL = "onboarding@syston.app"
# Environment-specific vars
WORKER_BASE_URL = "https://app.team-platform-2025.workers.dev"
ENVIRONMENT = "production"
DRY_RUN = "false"
MAKE_VALIDATE_STRICT = "true"
# ─────────────────────────────────────────────────────────
# SECRETS - Must be set via wrangler secret put --env production
# ─────────────────────────────────────────────────────────
# JWT_SECRET - wrangler secret put JWT_SECRET --env production
# YOUTUBE_API_KEY - wrangler secret put YOUTUBE_API_KEY --env production
# TEMPLATE_SPREADSHEET_ID - wrangler secret put TEMPLATE_SPREADSHEET_ID --env production
# BACKEND_API_KEY - wrangler secret put BACKEND_API_KEY --env production
# GAS_WEBAPP_URL - wrangler secret put GAS_WEBAPP_URL --env production
# GAS_HMAC_SECRET - wrangler secret put GAS_HMAC_SECRET --env production
# SUPABASE_URL - wrangler secret put SUPABASE_URL --env production
# SUPABASE_ANON_KEY - wrangler secret put SUPABASE_ANON_KEY --env production
# SUPABASE_SERVICE_ROLE - wrangler secret put SUPABASE_SERVICE_ROLE --env production
# EBAY_CLIENT_ID - wrangler secret put EBAY_CLIENT_ID --env production
# EBAY_CLIENT_SECRET - wrangler secret put EBAY_CLIENT_SECRET --env production
# SENTRY_DSN - wrangler secret put SENTRY_DSN --env production
# PYTHON_COACHING_SERVICE_URL - wrangler secret put PYTHON_COACHING_SERVICE_URL --env production

[[env.production.kv_namespaces]]
binding = "TENANTS"
id = "71b9f158fb2c4e1a8858dded2633ff5b"

[[env.production.kv_namespaces]]
binding = "KV_IDEMP"
id = "5948d4a91ac04b50904a06c923221994"

[[env.production.kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "2b092164260d45d6a9a4af55555ffc09"

[[env.production.d1_databases]]
binding = "DB"
database_name = "syston-db"
database_id = "3031c292-6290-4906-947d-ab9a145538ed"

[[env.production.queues.producers]]
binding = "POST_QUEUE"
queue = "post-queue"

[[env.production.queues.producers]]
binding = "HIGHLIGHTS_QUEUE"
queue = "highlights-queue"

[[env.production.queues.producers]]
binding = "DLQ"
queue = "dead-letter"

[[env.production.queues.consumers]]
queue = "post-queue"

[[env.production.r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "syston-media"

[[env.production.r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "oa-videos"

[[env.production.r2_buckets]]
binding = "HIGHLIGHTS_BUCKET"
bucket_name = "oa-highlights"

[[env.production.durable_objects.bindings]]
name = "TenantRateLimiter"
class_name = "TenantRateLimiter"

[[env.production.durable_objects.bindings]]
name = "VotingRoom"
class_name = "VotingRoom"

[[env.production.durable_objects.bindings]]
name = "ChatRoom"
class_name = "ChatRoom"

[[env.production.durable_objects.bindings]]
name = "MatchRoom"
class_name = "MatchRoom"

[[env.production.durable_objects.bindings]]
name = "GeoFenceManager"
class_name = "GeoFenceManager"

[[env.production.durable_objects.bindings]]
name = "PROVISIONER"
class_name = "Provisioner"

